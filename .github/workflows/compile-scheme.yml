name: Compile group scheme

on:
  push:
    branches: [main]
    paths:
      - pi_labs_scheme.tex
      - .github/workflows/compile-scheme.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: pi_labs_scheme.tex

      - name: Convert PDF to SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y pdf2svg
          pdf2svg pi_labs_scheme.pdf pi_labs_scheme.svg

      - name: Commit updated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update π-Labs scheme"
          file_pattern: pi_labs_scheme.svg
